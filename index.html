<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portafolio Web</title>
    <meta name="description" content="Portafolio grupal de programación">
    <link rel="stylesheet" href="assets/index.css">
</head>
<body>
    <header class="header">
        <nav class="navbar">
            <a href="#" class="logo">
                PORTAFOLIO
            </a>

            <ul class="nav-links">
                <li>
                    <a href="#">Inicio</a>
                </li>

                <li>
                    <a href="#proyectos">Proyectos</a>
                </li>

                <li>
                    <a href="#contacto">Contacto</a>
                </li>

            </ul>
        </nav>
    </header>

    <main>
        <section
            id="proyectos"
            class="projects-section"
            data-category="Proyectos de software"
            data-source="xml"
        >
            <h1>NUESTROS PROYECTOS</h1>

            <div class="projects-container">
                <div class="filters">
                    <button data-category="Proyecto_1">
                        Proyecto 1
                    </button>

                    <button data-category="Proyecto_2">
                        Proyecto_2
                    </button>

                    <button data-category="Proyecto_3">
                        Proyecto_3
                    </button>
                </div>
            </div>


            <article class="project-card">
                <h2>PROYECTO 1</h2>

                <div class="project-content">
                    <div class="project-image">
                        <span>IMAGEN</span>
                    </div>

                    <div class="project-info">

                        <h3>SUBTÍTULO</h3>

                        <p>
                            DESCRIPCIÓN DEL PROYECTO
                        </p>

                    </div>
                </div>
            </article>


        </section>
    </main>


    <footer id="contacto">
        <p>2026 - Portafolio Web</p>
    </footer>
</body>
</html>
